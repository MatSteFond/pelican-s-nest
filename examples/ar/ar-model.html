<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D object in your room</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- Google's model-viewer: shows a 3D model and opens the phone's own AR viewer
       (AR Quick Look on iPhone, Scene Viewer on Android). -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4/dist/model-viewer.min.js"></script>
  <style>
    model-viewer { width: 100%; height: 70vh; background: var(--surface); border: 1px solid var(--line); }
  </style>
</head>
<body>
  <main class="page">
    <h1>See a 3D object in your room</h1>
    <p>Drag to turn the object. On a phone, tap the AR button in the corner to place it in the room around you.</p>
    <!-- Replace this sample model with your own: put a .glb file in public/models/
         and change src to "/models/your-file.glb". Keep files under about 10 MB. -->
    <model-viewer
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      alt="A 3D model of an astronaut"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1">
    </model-viewer>
    <p><a href="/">Back to the app</a></p>
  </main>
</body>
</html>
